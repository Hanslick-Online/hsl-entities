name: Dump Entities from Baserow

on:
  schedule:
  - cron: "13 */12 * * *"
  workflow_dispatch:

jobs:
  download:
    name: dump baserow
    runs-on: ubuntu-latest
    env:
      BASEROW_TOKEN: ${{secrets.BASEROW_TOKEN}}
      BASEROW_USER: ${{secrets.BASEROW_USER}}
      BASEROW_PW: ${{secrets.BASEROW_PW}}
    steps:
      - name: Perfom Checkout
        uses: actions/checkout@v5
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: dump and denormalize data
        run: |
          for attempt in 1 2 3; do
            if uv run scripts/python/dump_data.py; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
          uv run scripts/python/denormalize.py
          uv run scripts/python/add_alternative_titles.py
      - name: data dump to xml
        run: |
          uv run scripts/python/json2xml.py
          uv run scripts/python/birth_death_dates.py
      - name: create pmb beacon
        run: |
          uv run scripts/python/pmb-beacon-generator.py
      - name: Commit data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Downloaded/Updated Data
